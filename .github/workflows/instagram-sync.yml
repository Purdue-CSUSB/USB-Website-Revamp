name: Sync Instagram events

# Pulls the 20 most recent @purdueusb posts, asks Groq which are events, and
# writes the top 6 to MongoDB. The job is a no-op when nothing has changed.
on:
  schedule:
    # 07:10 UTC daily (~2:10am Eastern). Off the hour because GitHub queues
    # heavily at :00.
    - cron: '10 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without writing to MongoDB'
        type: boolean
        default: false

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Sync Instagram posts to MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'purdue_usb' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.6-27b' }}
          IG_PROFILE: ${{ vars.IG_PROFILE || 'purdueusb' }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python backend/run_sync.py ${{ inputs.dry_run && '--dry-run' || '' }}
